name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Caches the downloaded Android SDK/NDK/platform-tools so repeat
      # builds don't re-fetch them every run. Safe to remove if you'd
      # rather always build from a clean slate.
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      # Uses the official Buildozer Docker image under the hood, so the
      # Android SDK/NDK/build toolchain are already set up inside it.
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-vault-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
          
